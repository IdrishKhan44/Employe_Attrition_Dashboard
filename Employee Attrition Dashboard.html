@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--cd:#172038;--tx:#e8ecf5;--mu:#97a3ba;--ln:#26314d;--nv:#0a0f1d;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--cd:#172038;--tx:#e8ecf5;--mu:#97a3ba;--ln:#26314d;--nv:#0a0f1d;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:218px;background:var(--nv);color:#fff;padding:22px 14px;flex:none;position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:100vh;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:15px;margin:0 8px 2px;letter-spacing:.2px}nav .s{font-size:11px;opacity:.6;margin:0 8px 18px}
nav a{color:#c9d3ea;text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08)}nav a.on{background:#2563EB;color:#fff}
nav .g{margin-top:auto;font-size:11px;opacity:.6;padding:0 8px}
main{flex:1;min-width:0;padding:22px 26px 34px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h2{margin:0;font-size:22px}header p{margin:2px 0 0;color:var(--mu)}
.fb{background:var(--cd);border-radius:14px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
.fb label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:3px;min-width:118px;flex:1}
select{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;font:inherit}
button{background:#DC3545;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 13px inherit;cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--cd);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;border-top:3px solid #2563EB}
.k b{display:block;font-size:24px;margin-top:2px}.k span{font-size:12px;color:var(--mu)}
.k.r{border-color:#DC3545}.k.r b{color:#DC3545}.k.g{border-color:#198754}.k.g b{color:#198754}.k.t{border-color:#0F9D8A}
.gr{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--cd);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;min-width:0;grid-column:span 12}
.card h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.card h3 small{font-weight:400;color:var(--mu);font-size:11px;white-space:nowrap}
.bx{height:250px;position:relative}.sc{overflow-x:auto}
@media(min-width:900px){.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}}
.ht{border-collapse:collapse;width:100%;font-size:12px}.ht th{font-weight:500;color:var(--mu);padding:5px 6px;text-align:left}
.ht td{text-align:center;padding:7px 4px;border:2px solid var(--cd)}.ht .na{color:var(--mu);background:var(--bg)}
.nt{font-size:11px;color:var(--mu);margin:8px 0 0}
.ins p{margin:0 0 9px}.ins .tag{display:inline-block;background:#DC3545;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin-right:6px}
.ft{margin-top:18px;font-size:11px;color:var(--mu)}
@media(max-width:899px){.app{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}nav h1,nav .s,nav .g{display:none}main{padding:14px}}
</style></head><body>
<div class="app"><nav id="nav"></nav>

function insights(el,rs){const o=rs.filter(r=>r.OverTime==='Yes'),n=rs.filter(r=>r.OverTime==='No'),rt=a=>a.length?a.reduce((p,r)=>p+r.L,0)/a.length:0;
 const top=groups(rs,'JobRole',1).filter(x=>x.n>=20).slice(0,3),yr=groups(rs,'TenureBucket').filter(x=>x.n>=10).sort((a,b)=>b.r-a.r)[0];
 el.innerHTML='<p><span class="tag">Roles</span>Highest attrition: '+(top.map(x=>x.k+' ('+pc(x.r)+', n='+x.n+')').join('; ')||'not enough data')+'.</p>'+
 '<p><span class="tag">Overtime</span>'+(o.length&&n.length?pc(rt(o))+' with overtime vs '+pc(rt(n))+' without.':'Needs both groups in the selection.')+'</p>'+
 '<p><span class="tag">Tenure</span>'+(yr?'Highest in '+yr.k+' ('+pc(yr.r)+', n='+yr.n+').':'Not enough data.')+'</p>'+
 '<p class="nt">Auto-updates with filters. Associations only: age, level, pay and tenure overlap, so use the filters to test them separately.</p>'}
function draw(){
 charts.forEach(c=>c.destroy());charts=[];const rs=rows(),L=rs.filter(r=>r.L).length;
 document.getElementById('pt').textContent=NAV[page];
 document.getElementById('nav').innerHTML='<h1>HR Analytics</h1><div class="s">Attrition dashboard</div>'+Object.keys(NAV).map(k=>'<a href="#'+k+'" class="'+(k===page?'on':'')+'">'+NAV[k]+'</a>').join('')+'<div class="g">Dataset: 1,470 employees, 35 fields</div>';
 document.getElementById('fb').innerHTML=SL.map(k=>'<label>'+k.replace(/([A-Z])/g,' $1').trim()+'<select data-k="'+k+'"><option value="">All</option>'+keys(k).map(v=>'<option'+(F[k]===String(v)?' selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'<button id="rs">Reset filters</button>';
 document.querySelectorAll('select').forEach(s=>s.onchange=()=>{F[s.dataset.k]=s.value;draw()});document.getElementById('rs').onclick=()=>{SL.forEach(k=>F[k]='');draw()};
 const a=k=>avg(rs.map(r=>r[k]));
 document.getElementById('kp').innerHTML=[['Total employees',rs.length.toLocaleString(),''],['Employees left',L,'r'],['Active employees',(rs.length-L).toLocaleString(),'g'],['Attrition rate',rs.length?pc(L/rs.length):'–','r'],['Retention rate',rs.length?pc(1-L/rs.length):'–','g'],['Average age',a('Age').toFixed(1),'t'],['Avg monthly income',Math.round(a('MonthlyIncome')).toLocaleString(),'t'],['Avg years at company',a('YearsAtCompany').toFixed(1),'t']].map(x=>'<div class="k '+x[2]+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
 const gr=document.getElementById('gr');
 if(!rs.length){gr.innerHTML='<div class="card"><p>No employees match these filters. Use “Reset filters”.</p></div>';return}
 gr.innerHTML=P[page].map((c,i)=>'<section class="card c'+c.w+'" style="'+(c.w==12?'':'')+'"><h3>'+c.t+'<small>'+rs.length+' employees</small></h3>'+(c.k==='heat'||c.k==='ins'?'<div class="'+(c.k==='ins'?'ins':'sc')+'" id="e'+i+'"></div>':'<div class="bx"><canvas id="e'+i+'"></canvas></div>')+'</section>').join('');
 P[page].forEach((c,i)=>{const el=document.getElementById('e'+i);c.k==='heat'?heat(el,rs,c):c.k==='ins'?insights(el,rs):build(el,rs,c)})}
const go=()=>{const h=location.hash.slice(1);page=NAV[h]?h:'overview';draw()};
addEventListener('hashchange',go);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
SL.forEach(k=>F[k]='');go();
</script></body></html>
